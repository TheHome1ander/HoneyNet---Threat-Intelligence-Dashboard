# ═══════════════════════════════════════════════════════════════════════════
# Nginx reverse proxy config for HoneyNet on AWS EC2 (ap-south-1)
#
# CONCEPT — Why Nginx in Front of Uvicorn?
# ──────────────────────────────────────────
# Uvicorn is an excellent ASGI server but it's not hardened for direct internet
# exposure.  Nginx sits in front and provides:
#   1. TLS termination (HTTPS) — handles SSL so Python never touches certs.
#   2. HTTP/1.1 → WebSocket upgrade headers for /ws.
#   3. Rate limiting — Nginx can block obvious DoS before Python even wakes up.
#   4. Request buffering — protects against slow-loris attacks.
#   5. Static file caching — serve CSS/JS directly without hitting Python.
#   6. Real IP extraction — X-Forwarded-For header set correctly.
#
# CONCEPT — WebSocket Proxying
# ──────────────────────────────
# WebSocket requires an HTTP/1.1 "Upgrade" dance:
#   Client → "Upgrade: websocket" + "Connection: Upgrade"
#   Server → 101 Switching Protocols
# Nginx must forward these headers explicitly.  The critical settings are:
#   proxy_http_version 1.1    ← WebSocket requires HTTP/1.1
#   proxy_set_header Upgrade  ← Pass the upgrade request through
#   proxy_set_header Connection "upgrade"
#   proxy_read_timeout 86400  ← Keep the connection alive for 24h
#                               (default 60s would kill every WebSocket)
#
# Place this file at: /etc/nginx/sites-available/honeypot
# Then: sudo ln -s /etc/nginx/sites-available/honeypot /etc/nginx/sites-enabled/
# ═══════════════════════════════════════════════════════════════════════════

# Upstream: the FastAPI/uvicorn process on localhost
upstream honeypot_app {
    server 127.0.0.1:8000;
    keepalive 32;   # Maintain a pool of persistent connections to uvicorn
}

# ── Rate limiting zones ────────────────────────────────────────────────────
# These are declared in the http {} context — keep them here if this file
# is include'd directly, or move to nginx.conf http block.
# limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=websocket:10m rate=5r/s;

# ── HTTP → HTTPS redirect (uncomment after adding SSL cert) ───────────────
# server {
#     listen 80;
#     server_name YOUR_DOMAIN_OR_IP;
#     return 301 https://$host$request_uri;
# }

# ── Main server block ──────────────────────────────────────────────────────
server {
    listen 80;
    # listen 443 ssl http2;              # Uncomment after adding cert
    server_name _;                       # Catch-all; replace with your domain

    # ── SSL (uncomment + fill in paths after running certbot) ─────────────
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/honeypot_access.log;
    error_log  /var/log/nginx/honeypot_error.log;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    # Hide Nginx version from attackers
    server_tokens off;

    # ── WebSocket endpoint (/ws) ──────────────────────────────────────────
    # MUST be declared before the general location / block so it takes
    # priority (Nginx matches location blocks longest-prefix first for
    # non-regex locations).
    location /ws {
        proxy_pass         http://honeypot_app;
        proxy_http_version 1.1;

        # The two critical WebSocket upgrade headers:
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Standard proxy headers so FastAPI sees the real client IP:
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ⚠️  CRITICAL: without this, Nginx closes the WS after 60s.
        proxy_read_timeout  86400s;   # 24 hours
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;

        # Disable buffering — WebSocket frames must be forwarded immediately
        proxy_buffering off;
    }

    # ── All other requests (HTTP API + dashboard) ─────────────────────────
    location / {
        proxy_pass         http://honeypot_app;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  10s;
        proxy_read_timeout     30s;
        proxy_send_timeout     30s;

        # Buffer responses in memory before sending to client
        # (protects uvicorn from slow clients)
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      16 8k;

        # Optional: rate limit general traffic
        # limit_req zone=general burst=50 nodelay;
    }

    # ── Static files served directly by Nginx (optional optimization) ─────
    # If you want Nginx to serve CSS/JS without touching Python at all,
    # uncomment and adjust the path to your project root.
    #
    # location /static/ {
    #     alias /home/ubuntu/honeypot/static/;
    #     expires 1h;
    #     add_header Cache-Control "public, immutable";
    # }
}
